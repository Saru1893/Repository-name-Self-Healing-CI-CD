name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile application
        run: g++ -std=c++17 -Wall -Wextra -Werror src/main.cpp -o app

      - name: Run application
        run: ./app

      - name: Compile tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_main.cpp -o test_app

      - name: Run tests
        run: ./test_app