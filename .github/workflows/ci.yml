
name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile C++ program
        run: g++ -std=c++17 -Wall -Wextra -Werror src/main.cpp -o app

      - name: Run C++ program
        run: ./app